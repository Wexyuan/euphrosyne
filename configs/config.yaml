app:
  name: euphrosyne # application name
  env: debug # runtime environment (debug/release/test)
  snowflake_node: 1 # snowflake worker node (0-1023)

server:
  addr: ":8080" # listen address (default to :8080)
  read_timeout: 10s # max request read time (default to 10s)
  write_timeout: 10s # max response write time (default to 10s)
  shutdown_timeout: 5s # max shutdown time (default to 5s)

logger:
  level: info # minimum log level (debug/info/warn/error)
  format: console # log encoding format (console/json)
  output: stdout # output stream (stdout/stderr)

database:
  driver: sqlite # database driver (mysql/postgres/sqlite)
  dsn: euphrosyne.db # data source name
  max_open_conns: 10 # max open connections (default to 10)
  max_idle_conns: 2 # max idle connections (default to 2)
  conn_max_lifetime: 30 # max connection lifetime in minutes (default to 30)

cache:
  driver: memory # cache driver (memory/redis)
  ttl: 300 # expiration in seconds (default to 300)
  # addr: 127.0.0.1:6379 # redis address (host:port)
  # password: "" # redis password
  # db: 0 # redis database (default to 0)

jwt:
  secret: "change-me-in-production" # HS256 signing key
  issuer: euphrosyne # issuer claim
  access_ttl: 15m # access token lifetime (default to 15m)
  refresh_ttl: 168h # refresh token lifetime (default to 168h)
